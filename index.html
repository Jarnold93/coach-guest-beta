/* ============================================================
   GUEST EDITION: shift work
   The user enters their hours week by week (Off / Day / Evening / Night / Custom). From that, every date in the
   week gets its own day plan (S.food[date].dayplan: meal times, reminders, sleep, whether a workout fits) and its own
   workout assignment (S.settings.trainMap[date] -> a key of DAYS). Dates without shifts keep the normal weekly plan.
   Data: S.settings.shifts[date] = {t:"off"|"day"|"evening"|"night"|"custom", s, e};  S.settings.shiftWeeks[monday] = true
   ============================================================ */
const SHIFT_DEFAULTS={day:{s:"07:00",e:"17:00",label:"Day"},evening:{s:"13:00",e:"22:00",label:"Evening"},night:{s:"21:00",e:"08:00",label:"Night"}};
function shiftPresets(){ const u=PF().shiftPresets||{}; const o={}; for(const k of Object.keys(SHIFT_DEFAULTS)) o[k]={...SHIFT_DEFAULTS[k],...(u[k]||{})}; return o; }
function dayFor(date){ const k=(S.settings.trainMap||{})[date]; if(k){ const e=Object.values(DAYS).find(x=>x.key===k); if(e) return e; } return DAYS[parseD(date).getDay()]; }
function mondayOf(date){ return addDays(date, -((parseD(date).getDay()+6)%7)); }
function shiftOn(date){
  const e=(S.settings.shifts||{})[date]; if(!e||e.t==="off") return null;
  const p=shiftPresets()[e.t]; const s=e.s||(p&&p.s), en=e.e||(p&&p.e); if(!s||!en) return null;
  return {t:e.t, s, e:en, label:e.t==="custom"?"Work":(p&&p.label)||"Shift", night: tmin(en)<=tmin(s)};
}
function shiftWorker(){ return !!PF().shiftWork; }
const hrs=m=>{ const h=Math.round(m/6)/10; return (h%1===0?String(h|0):String(h))+" h"; };

/* ---------- build one day around a shift ---------- */
function shiftDay(date, train){
  const P=PF(), dow=parseD(date).getDay();
  const sh=shiftOn(date), prev=shiftOn(addDays(date,-1)), next=shiftOn(addDays(date,1));
  const prevNight=!!(prev&&prev.night);
  const W0=tmin(P.wake), Bed0=tmin(P.sleep);
  const items=[], meals=[]; let trained=false, W=W0, why="", tAt=null;
  const add=(t,k,title,detail,x)=>items.push({t:tstr(t),k,title,detail:detail||"",...(x||{})});
  const meal=(t,title,detail)=>meals.push({t:Math.max(0,Math.min(1439,t)),title,detail:detail||""});
  let Bed=Bed0;
  if(next&&!next.night&&tmin(next.s)<8.5*60) Bed=Math.max(20*60+30, Math.min(Bed0, tmin(next.s)-100-450));
  else if(next&&next.night) Bed=Math.min(23*60+59, Bed0+60);

  if(prevNight){   // the end of last night's shift, then sleep
    const e=tmin(prev.e);
    add(0,"work",`Night shift, until ${prev.e}`,"The last stretch. Water and a protein snack beat another coffee.",{end:prev.e});
    const lc=e-6*60; if(lc>=60) add(lc,"drink","Last coffee of the shift","After this, caffeine mostly costs you sleep.");
    const nm=tmin(prev.s)+4*60-1440; if(nm>=15&&nm<e-90) meal(nm,"Night meal","Protein plus slow carbs: eggs on toast, a chicken wrap, yoghurt and fruit.");
    meal(e+25,"Light meal before sleep","Something small with protein (eggs, yoghurt, banana and nuts). A big meal will keep you awake.");
    const sl=e+60, wake=Math.min(sl+450, 17*60+30);
    add(sl,"sleep","Sleep after your night shift","Dark room, phone away, earplugs or an eye mask. About 7 hours so tonight's sleep still works.",{end:tstr(wake)});
    W=wake;
  }

  if(!sh){
    if(!prevNight){   // an ordinary day off: the standard builder
      const base=scheduleBuild(P, train?"train":"rest"); base.forEach(it=>items.push({...it})); trained=!!train; if(!train) why="rest day";
      if(Bed!==Bed0) items.forEach(it=>{ if(it.k==="sleep") it.t=tstr(it.title==="Wind down"?Bed-60:Bed); });
    }else{
      why="recovering from nights";
      meal(W+30,"First proper meal","Your main meal of the day. Protein first.");
      meal(Math.min(Math.max(W+270,18*60+30),Bed-120),"Dinner","Keep it normal-sized so you can sleep tonight.");
      add(Math.min(W+330,Bed-90),"move","Easy walk, 20 min","Daylight and a walk help reset your body clock.",{end:tstr(Math.min(W+350,Bed-70))});
      add(Bed-60,"sleep","Wind down","Early to bed tonight gets you back on track."); add(Bed,"sleep","Lights out","");
      items.push({t:tstr(W),k:"wake",title:"Wake up + 500 ml water",detail:"",water:0.5});
    }
  }else if(!sh.night){
    const ws=tmin(sh.s), we=tmin(sh.e), len=we-ws;
    if(!prevNight) W=Math.min(W0, Math.max(4*60+30, ws-100));
    if(!prevNight){ add(W,"wake","Wake up + 500 ml water","A glass of water before anything else.",{water:0.5}); add(W+2,"weigh","Weigh-in","After the toilet, before food or drink. Mon, Wed, Fri.",{days:[1,3,5]}); }
    add(ws,"work",`${sh.label} shift`,`${sh.s} to ${sh.e} (${hrs(len)})`,{end:sh.e});
    const preGap=ws-(W+30), postStart=we+40, postOK=we<=18*60+30&&len<=10.5*60&&Bed-(postStart+75)>=150;
    if(train){
      const preOK=preGap>=5*60&&!prevNight;
      if(preOK&&(P.trainWhen==="morning"||!postOK)) tAt=W+30; else if(postOK) tAt=postStart; else if(preOK) tAt=W+30;
      if(tAt!=null){ add(tAt,"train","Train","",{train:true,end:tstr(tAt+60)}); trained=true; } else why=len>10.5*60?"long shift":"no free window";
    } else why="rest day";
    if(preGap>=5*60){
      const m1=(tAt!=null&&tAt<ws)?tAt+75:W+45; meal(m1,"Breakfast","");
      if(ws-90>=m1+150) meal(ws-90,"Meal before shift","Protein and slow carbs so you're not running on empty at 10 am.");
    }else meal(Math.max(W+25,ws-70),"Breakfast before shift","Eat something even if you're not hungry.");
    if(len>=6*60) meal(ws+Math.round(len*0.5/15)*15,"Meal on shift","Pack it the night before so a busy shift can't make you skip it.");
    if(len>=10*60) meal(ws+Math.round(len*0.8/15)*15,"Snack on shift","Protein and fruit: yoghurt, a protein bar, nuts and a banana.");
    if(we<=23*60){ const pm=Math.max(we+(len>=9*60?30:45), (tAt!=null&&tAt>ws)?tAt+80:0); meal(pm, we>21*60?"Late dinner, keep it light":"Dinner", we>21*60?"Protein-led and not too big, so you can sleep.":"") ; }
    if(len>=5*60) add(ws+180,"water","Refill your bottle (500 ml)","Keep it where you can see it.",{water:0.5});
    if(len>=8*60) add(ws+360,"water","Refill your bottle (500 ml)","",{water:0.5});
    const afterEnd=Math.max(we,(tAt!=null&&tAt>ws)?tAt+60:0);
    if(afterEnd+120<=Bed-90) add(afterEnd+120,"move","Evening stretch, 10 min","Loosen up hips, back and shoulders.");
    add(Math.max(we+45,Bed-60),"sleep","Wind down","Dim the lights and put the phone away from the bed."); add(Math.max(Bed,we+105),"sleep","Lights out","Sleep is when training turns into muscle.");
  }else{   // a night shift that starts today
    const ws=tmin(sh.s);
    if(!prevNight){ add(W,"wake","Wake up + 500 ml water","A glass of water before anything else.",{water:0.5}); add(W+2,"weigh","Weigh-in","After the toilet, before food or drink. Mon, Wed, Fri.",{days:[1,3,5]}); }
    why="night shift tonight";
    const nap=ws-5*60;
    if(nap>=W+240) add(nap,"sleep","Nap before your night shift (90 min)","Dark room, alarm set. Even 90 minutes helps a lot.",{end:tstr(nap+90)});
    meal(W+45,"Breakfast","");
    const lunch=Math.min(12*60+30, nap-90); if(lunch>=W+45+150) meal(lunch,"Lunch","");
    meal(ws-90,"Meal before shift","Protein and slow carbs. This is your 'dinner'.");
    const os=ws+4*60; if(os<=23*60+30) meal(os,"Meal on shift","Pack it before you leave: protein plus slow carbs, nothing heavy or greasy.");
    add(ws,"work",`Night shift, ${sh.s} to ${sh.e}`,`Runs into tomorrow morning (${hrs((tmin(sh.e)+1440)-ws)}).`,{end:"23:59"});
    if(ws+120<1440) add(ws+120,"water","Refill your bottle (500 ml)","Water through the shift. Stop caffeine about 6 hours before it ends.",{water:0.5});
  }

  // meals -> slots (the standard builder already tagged its own)
  if(!items.some(i=>i.slot)&&meals.length){
    meals.sort((a,b)=>a.t-b.t); const mm=meals.length>4?meals.filter(m=>!/Snack on shift/.test(m.title)).slice(0,4):meals;
    const names={1:["dinner"],2:["breakfast","dinner"],3:["breakfast","lunch","dinner"],4:["breakfast","lunch","snack","dinner"]}[mm.length];
    mm.forEach((m,i)=>items.push({t:tstr(m.t),k:"meal",slot:names[i],title:m.title,detail:m.detail}));
  }
  items.sort((a,b)=>tmin(a.t)-tmin(b.t));
  const base=(S.plan.days||{})[String(dow)]||[]; const optsFor=sl=>((base.find(x=>x.slot===sl)||base.find(x=>x.slot==="lunch")||base[0]||{}).opts)||[];
  const slots=items.filter(i=>i.slot).map(i=>({label:i.title,opts:optsFor(i.slot),slot:i.slot,time:i.t}));
  const parts=[]; if(sh) parts.push(`${sh.label} shift ${sh.s} to ${sh.e}.`); else if(prevNight) parts.push("You're coming off a night shift."); else parts.push("No shift.");
  parts.push(trained?"Your workout is "+(tAt!=null&&sh&&tAt<tmin(sh.s)?"before":"after")+" work.":(why?("No workout: "+why+"."):""));
  return {items, slots, rest:!trained, trained, note:parts.join(" ").trim(), dow};
}

/* ---------- plan a whole week ---------- */
const daysBetweenD=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
function planShiftWeek(mon){
  const P=PF(), today=todayStr();
  const dates=Array.from({length:7},(_,i)=>addDays(mon,i)).filter(d=>d>=today); if(!dates.length) return;
  const want=Math.max(1,Math.min(6,Number(P.days)||3)); let n=Math.round(want*dates.length/7); if(dates.length>=3) n=Math.max(1,n);
  const cand=dates.filter(d=>shiftDay(d,true).trained).map(d=>({d,sc:shiftOn(d)?2:3}));
  const chosen=[]; const adj=d=>chosen.some(c=>Math.abs(daysBetweenD(c,d))===1);
  const run3=d=>{ const has=x=>chosen.includes(addDays(d,x)); return (has(-1)&&has(-2))||(has(-1)&&has(1))||(has(1)&&has(2)); };
  const pass=strict=>{ for(const c of cand.slice().sort((a,b)=>b.sc-a.sc||a.d.localeCompare(b.d))){ if(chosen.length>=n) break; if(chosen.includes(c.d)) continue; if(strict&&adj(c.d)) continue; if(run3(c.d)) continue; chosen.push(c.d); } };
  pass(n<=3); pass(false); chosen.sort();
  S.settings.trainMap=S.settings.trainMap||{};
  for(const d of dates){
    const idx=chosen.indexOf(d); S.settings.trainMap[d]=idx>=0?"w"+idx:"light";
    const r=shiftDay(d, idx>=0); const fd=foodDay(d);
    fd.dayplan={title:"Your day around work", note:r.note, pick:"shift", variants:[{id:"shift",label:"Shift day",rest:r.rest,slots:r.slots,items:r.items}]};
    saveFood(d);
  }
  S.settings.shiftWeeks=S.settings.shiftWeeks||{}; S.settings.shiftWeeks[mon]=true;
  saveSettings(); cacheAll();
}
function reapplyShifts(){ if(!shiftWorker()) return; Object.keys(S.settings.shiftWeeks||{}).forEach(m=>planShiftWeek(m)); }
function clearShiftPlans(){
  const today=todayStr();
  for(const d of Object.keys(S.food||{})){ if(d>=today&&S.food[d].dayplan&&S.food[d].dayplan.pick==="shift"){ delete S.food[d].dayplan; saveFood(d); } }
  for(const d of Object.keys(S.settings.trainMap||{})) if(d>=today) delete S.settings.trainMap[d];
  S.settings.shiftWeeks={}; saveSettings(); cacheAll();
}
function shiftTxt(date){
  if(!shiftWorker()) return "";
  const out=[]; for(let i=0;i<7;i++){ const d=addDays(date,i), s=shiftOn(d); const lab=parseD(d).toLocaleDateString(undefined,{weekday:"short",day:"numeric"}); out.push(s?`${lab} ${s.label} shift ${s.s}-${s.e}`:`${lab} off`); }
  return `WORKS ROTATING SHIFTS (plan food, sleep and training around them; shift days are the hard ones): ${out.join("; ")}.`;
}

/* ---------- week planner (full-screen sheet) ---------- */
const SH={open:false,mon:null,rows:{},pre:null,msg:""};
function shLoad(){ SH.rows={}; for(let i=0;i<7;i++){ const d=addDays(SH.mon,i), e=(S.settings.shifts||{})[d]; SH.rows[d]=e?{...e}:{t:"off"}; } SH.pre=JSON.parse(JSON.stringify(shiftPresets())); }
function shOpen(mon){ SH.open=true; SH.mon=mon||mondayOf(todayStr()); SH.msg=""; shLoad(); shRender(); }
function shClose(){ SH.open=false; const el=document.getElementById("sh"); if(el) el.hidden=true; document.body.classList.remove("ob-open"); }
function shRowTimes(r){ if(r.t==="off") return ""; const p=SH.pre[r.t]; const s=r.s||(p&&p.s)||"", e=r.e||(p&&p.e)||""; return s&&e?`${s} to ${e}`:""; }
function shRender(){

  el.innerHTML=`<div class="ob-top"><button class="ob-back" id="shCancel">‹ Close</button><b style="flex:1;text-align:center">Your work hours</b><span style="width:56px"></span></div>
  <div class="ob-body" id="shBody">
   <div style="display:flex;align-items:center;justify-content:space-between"><button class="btn ghost sm" data-shweek="-7">‹ Earlier</button><b>Week of ${monLab}</b><button class="btn ghost sm" data-shweek="7">Later ›</button></div>
   <p class="small muted">Tap what you're working each day. Coach rebuilds your meals, water, sleep and workouts around it, and drops the workout on days it doesn't fit. Moving to another week saves this one.</p>
   ${rows}
   <button class="btn ghost" data-shcopy="1">Copy from the week before</button>

   <div class="small" style="color:var(--red)">${esc(SH.msg||"")}</div>
  </div>
  <div class="ob-foot"><button class="btn" id="shSave">Save and plan my week</button></div>`;

function shCommit(){
  S.settings.shifts=S.settings.shifts||{};
  const P={...PF(), shiftWork:true, shiftPresets:SH.pre}; S.settings.profile=P;
  for(const [d,r] of Object.entries(SH.rows)){ if(r.t==="off") delete S.settings.shifts[d]; else S.settings.shifts[d]=r.t==="custom"?{t:"custom",s:r.s||"08:00",e:r.e||"16:00"}:{t:r.t}; }
  planShiftWeek(SH.mon);
}
function wireSh(el){
  el.addEventListener("click",e=>{
    const t=e.target.closest("button"); if(!t) return; const y=document.getElementById("shBody")?.scrollTop||0; const back=()=>{ const b=document.getElementById("shBody"); if(b) b.scrollTop=y; };
    if(t.id==="shCancel"){ shClose(); return; }
    if(t.dataset.shset){ const [d,k]=t.dataset.shset.split("|"); SH.rows[d]={t:k,...(k==="custom"?{s:(SH.rows[d].s||"08:00"),e:(SH.rows[d].e||"16:00")}:{})}; shRender(); back(); return; }
    if(t.dataset.shweek){ shCommit(); SH.mon=addDays(SH.mon,Number(t.dataset.shweek)); shLoad(); shRender(); return; }
    if(t.dataset.shcopy){ for(const d of Object.keys(SH.rows)){ const p=(S.settings.shifts||{})[addDays(d,-7)]; SH.rows[d]=p?{...p}:{t:"off"}; } shRender(); back(); return; }
    if(t.id==="shSave"){ shCommit(); shClose(); render(); toast("Week planned"); return; }
  });
  el.addEventListener("input",e=>{ const t=e.target;
    if(t.dataset.shin){ const [d,f]=t.dataset.shin.split("|"); SH.rows[d][f]=t.value; const lab=t.closest(".ob-card").querySelector(".small.muted"); if(lab) lab.textContent=shRowTimes(SH.rows[d]); }
    if(t.dataset.shpre){ const [k,f]=t.dataset.shpre.split("|"); SH.pre[k][f]=t.value; }
  });
}

/* ---------- settings card + Today nudge ---------- */
function shiftsCard(){

  if(!P.shiftWork) return `<section class="card" id="shiftcard"><div class="chead"><h2>Work shifts</h2></div>

  const today=todayStr(); const rows=Array.from({length:7},(_,i)=>addDays(today,i)).map(d=>{ const s=shiftOn(d); const tr=(S.settings.trainMap||{})[d]; const lab=parseD(d).toLocaleDateString(undefined,{weekday:"short",day:"numeric"});

    <p class="small muted" style="margin:0">Days you haven't entered keep your normal weekly plan.</p></section>`;
}
function shiftNudge(){
  if(!shiftWorker()) return ""; const today=todayStr(), m0=mondayOf(today), m1=addDays(m0,7), dow=parseD(today).getDay(); const W=S.settings.shiftWeeks||{};
  let mon=null, msg="";
  if(!W[m0]){ mon=m0; msg="What are your hours this week? Your meals, sleep and workouts are built around them."; }
  else if(!W[m1]&&(dow===0||dow>=4)){ mon=m1; msg="Next week's rota usually lands about now. Enter your hours and Coach will plan it."; }
  if(!mon) return "";

}
