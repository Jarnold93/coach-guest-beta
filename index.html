<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Coach Guest BETA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B45309">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coach Guest BETA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface2:#EDEFF4; --ink:#15212B; --muted:#5B6B78; --line:#E2E6ED;
  --blue:#1D55A6; --blue-soft:#DCE6F5; --red:#C0322B; --red-soft:#F6DEDC; --yellow:#C99A06; --yellow-soft:#F7EDC8;
  --green:#2E7D4F; --green-soft:#DCEFE3; --focus:#1D55A6;
  --burg:#7A1F3D; --burg-soft:#F5DFE6; --sap:#1F4E9C; --sap-soft:#DDE7F8; --mint:#1C8A68; --mint-soft:#D5F0E5; --amber:#B2711A; --amber-soft:#F9E9CC; --plum:#5B3E8C; --plum-soft:#E8E0F4; --tabc:#3E6AAE;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root, :root[data-theme="dark"]{ color-scheme: light; }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px));}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:14px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:30px;font-weight:700;line-height:1.05}
h2{font-size:22px;font-weight:600}
h3{font-size:20px;font-weight:600;line-height:1.1}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--green)} .dot.busy{background:var(--yellow)} .dot.off{background:var(--red)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:0;background:var(--surface);border-radius:10px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.day .d{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.day .n{font-family:var(--display);font-size:20px;font-weight:600;line-height:1}
.day .t{font-size:10px;color:var(--muted);white-space:nowrap}
.day.sel{background:var(--ink);color:var(--bg)} .day.sel .d,.day.sel .t{color:var(--bg);opacity:.8}
.day .m{width:6px;height:6px;border-radius:50%;background:transparent}
.day .m.done{background:var(--green)} .day .m.part{background:var(--yellow)}
.weeknav{display:flex;justify-content:space-between;align-items:center}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:600;padding:6px 2px}

/* session header */
.sess{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--ink)}
.chip.fast{background:var(--yellow-soft);color:var(--yellow)}
.chip.steady{background:var(--blue-soft);color:var(--blue)}
.chip.back{background:var(--red-soft);color:var(--red)}
.chip.up{background:var(--green-soft);color:var(--green)}

/* cards */
.card{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.done{opacity:.85}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rx{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cue{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:9px}
.cue.warn{border-color:var(--red);color:var(--ink)}
.cue.coach{border-color:var(--blue);background:var(--blue-soft);color:var(--ink);padding:7px 9px;border-radius:0 8px 8px 0}
.thumb{position:relative;display:inline-block}
.subtot{border-top:1px dashed var(--line);margin-top:4px;padding-top:4px}
.ingrow{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--line)}
.ingname{flex:1;min-width:0}.ingname .linkbtn{text-align:left;padding:0}
.ing-g{width:72px;flex:none;text-align:right}
.thumb img{width:56px;height:56px;object-fit:cover;border-radius:8px;display:block}
.thumb .x{position:absolute;top:-6px;right:-6px;background:var(--surface);border-radius:50%;width:22px;height:22px;padding:0;line-height:22px;border:1px solid var(--line)}
.vid{font-size:13px}
.vid a{color:var(--blue);font-weight:600;text-decoration:none}
.mvlink{color:var(--blue);text-decoration:none;font-size:12px;padding:0 4px}
.exnote summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:13px}
.exnote textarea{margin-top:6px}
.sugg{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:10px;padding:9px 11px}
.sugg .big{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.sugg .why{font-size:13px;color:var(--muted)}
.plate{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:5px;vertical-align:middle;margin-left:6px;font-family:var(--body)}
.plate.assist{background:var(--blue-soft);color:var(--blue)}
.plate.bw{background:var(--green-soft);color:var(--green)}
.plate.added{background:var(--red-soft);color:var(--red)}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:22px 1fr 64px;gap:8px;align-items:center}
.setrow.noload{grid-template-columns:22px 1fr}
.setrow.extraset .setno{font-weight:700;color:var(--orange,#c2410c)}
.setno{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.loadbox{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:4px}
.loadbox input{text-align:center;padding:8px 2px;width:100%}
.step{height:38px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;font-size:18px;font-weight:600;padding:0}
.reps{text-align:center;width:100%}
.eff{grid-column:2 / 4;font-size:12px;color:var(--muted);margin-top:-3px;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--blue);flex:none}
.moves{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.moves label{display:flex;gap:10px;align-items:flex-start}
.moves input{width:20px;height:20px;margin-top:1px;accent-color:var(--green);flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.status{font-size:13px;font-weight:600}
.status.up{color:var(--green)} .status.hold{color:var(--muted)} .status.back{color:var(--red)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{border:0;background:none;padding:8px 0;font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.03em;color:var(--muted);border-radius:10px}
.tab.on{color:var(--ink);background:var(--surface2)}

/* progress */
.chartbox{width:100%;overflow:hidden}
.chartbox svg{width:100%;height:auto;display:block}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:8px 10px}
.stat .v{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:4px}
.row .field{flex:1 1 120px}
.field span{font-size:12px;color:var(--muted);font-weight:600}
.exsteps{display:flex;flex-direction:column;gap:0}
.exstep{display:grid;grid-template-columns:1fr 74px 74px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.exstep input{width:100%;text-align:center;padding:6px 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.banner{background:var(--yellow-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
@media (prefers-reduced-motion: no-preference){.card{transition:opacity .2s}}

/* today / nutrition */
.macros{display:flex;flex-direction:column;gap:9px}
.mrow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.mrow .lbl{font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--blue)}
.bar.p i{background:var(--green)} .bar.over i{background:var(--red)} .bar.fib i{background:var(--yellow)}
.bigp{display:flex;align-items:baseline;gap:8px}
.bigp .v{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.meal{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0;padding-top:2px}
.meal .time{font-family:var(--display);font-size:18px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.meal .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.meal select{width:100%;font-weight:600}
.meal .mac{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal details{font-size:13px;color:var(--muted)}
.meal details summary{cursor:pointer;color:var(--blue);font-weight:600}
.meal ul{margin:6px 0 0;padding-left:18px}
.meal.eaten .time{color:var(--green)}
.ate{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--green-soft);color:var(--green);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.ok{background:var(--green);color:#fff}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.entry{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.entry:first-child{border-top:0}
.entry .mac{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:4px 6px}
.results{display:flex;flex-direction:column;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.results button{border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;padding:9px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.results button:last-child{border-bottom:0}
.results small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.coachbox{background:var(--blue-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.coachbox .who{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.coachbox p{margin:0;white-space:pre-wrap}
.answer{white-space:pre-wrap;font-size:14px;background:var(--surface2);border-radius:10px;padding:10px 12px}
.water{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.water .v{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;min-width:70px}
.scale{display:flex;gap:4px}
.scale button{width:36px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600}
.scale button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid5{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.grid5 input{width:100%;text-align:center;padding:7px 2px}
.wo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tl{display:grid;grid-template-columns:26px 50px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.tl:first-child{border-top:0}
.tl.past .tlt,.tl.past .tlb{opacity:.5}
.tl.done .tlh b{color:var(--muted)}
.tl.now{background:var(--blue-soft);border-radius:10px;padding:10px 8px;margin-inline:-8px;border-top-color:transparent}
.tl.now + .tl{border-top-color:transparent}
.tlc input{width:22px;height:22px;accent-color:var(--green);margin:1px 0 0}
.tlt{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--muted)}
.tlt small{display:block;font-family:var(--body);font-size:11px;font-weight:500}
.tlb{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:13px;color:var(--muted)}
.tlh{color:var(--ink);font-size:15px;display:flex;align-items:baseline;gap:7px}
.kdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted);transform:translateY(-1px)}
.k-dog{background:var(--yellow)} .k-busy{background:var(--muted);border-radius:2px} .pill.warn{background:var(--yellow-soft);color:var(--ink)}
.k-meal{background:var(--green)} .k-water{background:var(--blue)} .k-move{background:var(--yellow)} .k-train{background:var(--red)} .k-supp{background:var(--red)} .k-sleep{background:var(--ink)} .k-weigh{background:var(--blue)} .k-wake{background:var(--yellow)}
.tlx{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tlx input{width:90px;padding:6px 8px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--surface2);color:var(--ink)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.nowcard{display:flex;flex-direction:column;gap:6px}
.nowcard .big{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.nowcard .nx{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.banner.info{background:var(--blue-soft)}
.hm{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.hm:first-child{border-top:0}
.hm .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.hm .n{grid-column:1 / 3;font-size:12px;color:var(--muted)}
.bp{display:flex;gap:6px;align-items:center}
.bp input{width:70px;text-align:center}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:64px;resize:vertical}
/* calm theme: neutral surfaces, soft mesh background, colour reserved for data */
body[data-tab=today]{--tabc:#3E6AAE} body[data-tab=food]{--tabc:#2A8A70} body[data-tab=train]{--tabc:#8A3B58} body[data-tab=progress]{--tabc:#6A55A0} body[data-tab=settings]{--tabc:#55667A}
html{background:var(--bg)} body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 38% at 12% 0%,rgba(176,219,198,.55),transparent 70%),radial-gradient(52% 34% at 100% 6%,rgba(250,200,168,.50),transparent 70%),radial-gradient(70% 40% at 55% 100%,rgba(196,187,238,.38),transparent 70%)}
.card{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.95);border-radius:20px;box-shadow:0 1px 2px rgba(25,35,60,.04),0 10px 28px -14px rgba(25,35,60,.16)}
@supports (backdrop-filter:blur(8px)){.card{backdrop-filter:blur(14px)}}
.card .card{box-shadow:none;border:1px solid var(--line);background:var(--surface2);backdrop-filter:none}
.linkbtn,.mvlink,.vid a,.meal details summary,.exnote summary{color:var(--tabc)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.day{box-shadow:0 1px 2px rgba(25,35,60,.05)}
.day.sel{background:var(--ink);color:#fff} .day.sel .d,.day.sel .t{color:#fff}
.tabs{background:rgba(255,255,255,.82);border-top:1px solid rgba(255,255,255,.9)}
@supports (backdrop-filter:blur(8px)){.tabs{backdrop-filter:blur(18px)}}
.tab.on{background:color-mix(in srgb,var(--tabc) 13%,transparent);color:var(--tabc)}
.meal details div{white-space:pre-line}
.meal,.card,.tl{scroll-margin-top:14px}
.hero{border-radius:24px;padding:18px;color:var(--ink);background:linear-gradient(135deg,#FBE4EA 0%,#FCEBDD 48%,#E7E4F7 100%);box-shadow:0 12px 30px -16px rgba(120,50,80,.35);display:flex;align-items:center;gap:18px}
.ringbox{position:relative;width:150px;height:150px;flex:none}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ringc b{font-family:var(--display);font-size:42px;font-weight:700;font-variant-numeric:tabular-nums}
.ringc span{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600;letter-spacing:.04em}
.hstats{display:flex;flex-direction:column;gap:12px;min-width:0}
.hstats div{display:flex;flex-direction:column}
.hstats span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hstats b{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcard{border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;border:1px solid rgba(255,255,255,.9)}
.mcard.p{background:linear-gradient(160deg,#EAF1FD,#F6F9FF)} .mcard.c{background:linear-gradient(160deg,#E4F5EE,#F5FBF8)} .mcard.f{background:linear-gradient(160deg,#EEE9FB,#F8F6FE)}
.mcard .rb{position:relative;width:56px;height:56px}
.mcard .rb i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:var(--ink)}
.mcard .v{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mcard .v small{font-size:14px;font-weight:600;margin-left:1px;color:var(--muted)}
.mcard .l{font-size:12px;font-weight:600;color:var(--muted)}
.mcard .s{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ring-arc{animation:rin .9s cubic-bezier(.2,.7,.2,1)}
@keyframes rin{from{stroke-dasharray:0 1000}}
@media (prefers-reduced-motion: reduce){.ring-arc{animation:none}}

<script>
/* Coach platform layer: gives the app the same window.claude.use() interface it had on claude.ai,
   but backed by this phone:
   - db:     IndexedDB (works offline) + sync to a private GitHub repo (data/<collection>/<id>.json)
   - sample: Claude via the Anthropic API with the owner's key (photos supported)
   - assets: photos kept on the phone + uploaded to the private repo (photos/<id>.jpg)
   - downloads: normal browser download
   Keys live only in this phone's localStorage (coach.cfg). */
(function(){
"use strict";
const CFG_KEY="coachgb.cfg";
function cfg(){ try{ return JSON.parse(localStorage.getItem(CFG_KEY))||{}; }catch(e){ return {}; } }
function setCfg(o){ const c={...cfg(),...o}; try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} return c; }

/* ---------- IndexedDB ---------- */
const idb=(()=>{ let p;
  function open(){ return p||(p=new Promise((res,rej)=>{ const r=indexedDB.open("coachgb",1);
    r.onupgradeneeded=()=>{ const d=r.result; ["docs","blobs","meta"].forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:s==="docs"?"path":s==="blobs"?"id":"k"}); }); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }
  async function tx(store, mode, fn){ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction(store,mode); const r=fn(t.objectStore(store)); t.oncomplete=()=>res(r?r.result:undefined); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
  return { all:s=>tx(s,"readonly",st=>st.getAll()), get:(s,k)=>tx(s,"readonly",st=>st.get(k)), put:(s,v)=>tx(s,"readwrite",st=>st.put(v)), del:(s,k)=>tx(s,"readwrite",st=>st.delete(k)) };
})();

/* ---------- helpers ---------- */
const GH="https://api.github.com";
function b64enc(str){ const bytes=new TextEncoder().encode(str); let bin=""; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); }
function b64dec(b64){ return new TextDecoder().decode(Uint8Array.from(atob(String(b64).replace(/\s/g,"")), c=>c.charCodeAt(0))); }
async function blobToB64(blob){ const buf=new Uint8Array(await blob.arrayBuffer()); let bin=""; for(let i=0;i<buf.length;i+=0x8000) bin+=String.fromCharCode.apply(null, buf.subarray(i,i+0x8000)); return btoa(bin); }
async function gh(path, opt={}){
  const c=cfg();
  const r=await fetch(GH+path,{method:opt.method||"GET", body:opt.body, cache:"no-store",
    headers:{Authorization:"Bearer "+c.token, Accept:opt.accept||"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", ...(opt.body?{"Content-Type":"application/json"}:{})}});
  if(!r.ok){ const e=new Error("GitHub "+r.status); e.status=r.status; try{ e.body=await r.json(); }catch(_){} throw e; }
  if(opt.raw) return r;
  return r.status===204?null:r.json();
}
const repo=()=>{ const c=cfg(); return `/repos/${c.owner}/${c.repo||"coach-data"}`; };

/* ---------- local document store ---------- */
const docs=new Map();          // path -> {path, coll, data, sha, dirty, t}
const subs=new Set();
let loaded=null;
function collOf(path){ return path.split("/").slice(0,-1).join("/"); }
function loadAll(){ return loaded||(loaded=idb.all("docs").then(rows=>{ rows.forEach(r=>docs.set(r.path,r)); }).catch(()=>{})); }
function snap(path){ const r=docs.get(path); const has=!!(r&&r.data); return {id:path.split("/").pop(), exists:has, data:()=>has?JSON.parse(JSON.stringify(r.data)):undefined, metadata:{hasPendingWrites:false}}; }
function emit(paths){ subs.forEach(s=>{ try{ s(paths); }catch(e){ console.error(e); } }); }
async function write(path, data){
  await loadAll();
  const r=docs.get(path)||{path, coll:collOf(path), sha:null};
  r.data=data; r.dirty=true; r.t=Date.now()+Math.random();
  docs.set(path,r); try{ await idb.put("docs",r); }catch(e){}
  emit([path]); schedulePush();
}
function deepMerge(a,b){ const o={...(a||{})}; for(const k of Object.keys(b)){ const v=b[k]; if(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])) o[k]=deepMerge(o[k],v); else o[k]=v; } return o; }
const clone=d=>JSON.parse(JSON.stringify(d));
const db={
  doc(path){ return {
    async set(d){ await write(path, clone(d)); },
    async update(d){ await loadAll(); const r=docs.get(path); if(!r||!r.data){ const e=new Error("Document does not exist"); e.code="invalid_argument"; throw e; } await write(path, deepMerge(r.data, clone(d))); },
    async get(){ await loadAll(); return snap(path); },
    async delete(){ await write(path, null); },
    onSnapshot(cb){ let alive=true; const f=paths=>{ if(alive && paths.includes(path)) cb(snap(path)); };
      loadAll().then(()=>{ if(alive){ cb(snap(path)); subs.add(f); } }); return ()=>{ alive=false; subs.delete(f); }; }
  }; },
  collection(name){ const q={ _o:null, _l:null,
    orderBy(f,dir){ q._o=[f,dir]; return q; }, limit(n){ q._l=n; return q; }, where(){ return q; },
    async get(){ await loadAll(); const rows=q._rows(); return {docs:rows.map(r=>snap(r.path)), size:rows.length, empty:!rows.length}; },
    _rows(){ let rows=[...docs.values()].filter(r=>r.coll===name && r.data); if(q._o){ const [f,dir]=q._o; rows.sort((a,b)=>((a.data[f]??0)-(b.data[f]??0))*(dir==="desc"?-1:1)); } if(q._l) rows=rows.slice(0,q._l); return rows; },
    onSnapshot(cb){ let alive=true; const known=new Map();
      const fire=force=>{ const rows=q._rows(); const ids=new Set(rows.map(r=>r.path)); const changes=[];
        rows.forEach(r=>{ const k=known.get(r.path); if(k===undefined) changes.push({type:"added",doc:snap(r.path)}); else if(k!==r.t) changes.push({type:"modified",doc:snap(r.path)}); known.set(r.path,r.t); });
        [...known.keys()].forEach(p=>{ if(!ids.has(p)){ changes.push({type:"removed",doc:snap(p)}); known.delete(p); } });
        if(changes.length||force) cb({docs:rows.map(r=>snap(r.path)), docChanges:()=>changes, size:rows.length, empty:!rows.length}); };
      const f=paths=>{ if(alive && paths.some(p=>collOf(p)===name)) fire(false); };
      loadAll().then(()=>{ if(alive){ fire(true); subs.add(f); } }); return ()=>{ alive=false; subs.delete(f); }; }
  }; return q; }
};

/* ---------- GitHub sync ---------- */
const syncState={status:"idle", at:0, msg:""};
function setStatus(status, msg){ syncState.status=status; syncState.msg=msg||""; if(status==="ok") syncState.at=Date.now(); window.dispatchEvent(new CustomEvent("coach-sync",{detail:{...syncState}})); }
let pushT=null, syncing=false, again=false;
function schedulePush(){ clearTimeout(pushT); pushT=setTimeout(()=>sync(), 2500); }
const repoPath=p=>"data/"+p+".json";
async function sync(){
  const c=cfg();
  if(!c.token||!c.owner){ setStatus("local","Sync not set up"); return; }
  if(!navigator.onLine){ setStatus("offline","Offline · saved on this phone"); return; }
  if(syncing){ again=true; return; }
  syncing=true; setStatus("busy");
  try{ await loadAll(); await pushDirty(); await pull(); await pushDirty(); await uploadBlobs(); setStatus("ok"); }
  catch(e){ setStatus(e.status===401||e.status===403?"auth":"error", e.status===401?"GitHub token rejected. Update it in Settings.":e.status===403?"GitHub token lacks access to the data repo.":"Couldn't sync. Will retry."); }
  finally{ syncing=false; if(again){ again=false; schedulePush(); } }
}
async function pushDirty(){
  for(const r of [...docs.values()].filter(r=>r.dirty)){
    const t0=r.t, url=`${repo()}/contents/${repoPath(r.path)}`;
    if(r.data===null){
      let sha=r.sha; if(!sha){ const cur=await gh(url).catch(()=>null); sha=cur&&cur.sha; }
      if(sha){ try{ await gh(url,{method:"DELETE", body:JSON.stringify({message:"delete "+r.path, sha})}); }catch(e){ if(![404,409,422].includes(e.status)) throw e; } }
      if(r.t===t0){ docs.delete(r.path); await idb.del("docs",r.path); }
      continue;
    }
    const put=sha=>gh(url,{method:"PUT", body:JSON.stringify({message:"sync "+r.path, content:b64enc(JSON.stringify(r.data)), ...(sha?{sha}:{})})});
    let res;
    try{ res=await put(r.sha); }
    catch(e){ if(e.status===409||e.status===422){
        // someone else (another device, or Claude) changed this doc: keep their fields that this phone doesn't have
        const cur=await gh(url).catch(()=>null);
        if(cur&&cur.content){ try{ const remote=JSON.parse(b64dec(cur.content)); if(remote&&typeof remote==="object"){ r.data={...remote, ...r.data}; emit([r.path]); } }catch(_){} }
        res=await put(cur&&cur.sha); } else throw e; }
    r.sha=res.content.sha; if(r.t===t0) r.dirty=false; await idb.put("docs",r);
  }
}
async function pull(){
  const ref=await gh(`${repo()}/git/ref/heads/main`); const head=ref.object.sha;
  const last=(await idb.get("meta","head"))?.v; if(head===last) return;
  const tree=await gh(`${repo()}/git/trees/${head}?recursive=1`);
  const changed=[];
  for(const it of tree.tree){
    if(it.type!=="blob"||!it.path.startsWith("data/")||!it.path.endsWith(".json")) continue;
    const path=it.path.slice(5,-5); const r=docs.get(path);
    if(r && (r.sha===it.sha || r.dirty)) continue;          // unchanged, or a newer local edit wins
    const blob=await gh(`${repo()}/git/blobs/${it.sha}`);
    let data; try{ data=JSON.parse(b64dec(blob.content)); }catch(e){ continue; }
    const nr={path, coll:collOf(path), data, sha:it.sha, dirty:false, t:Date.now()+Math.random()};
    docs.set(path,nr); await idb.put("docs",nr); changed.push(path);
  }
  await idb.put("meta",{k:"head",v:head});
  if(changed.length) emit(changed);
}
window.addEventListener("online", ()=>sync());
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") sync(); });
setInterval(()=>{ if(document.visibilityState==="visible") sync(); }, 60000);

/* ---------- photos ---------- */
const photoUrls={};
async function uploadBlobs(){
  if(!navigator.onLine||!cfg().token) return;
  for(const b of (await idb.all("blobs")).filter(x=>x.pending)){
    try{ await gh(`${repo()}/contents/photos/${b.id}.jpg`,{method:"PUT", body:JSON.stringify({message:"photo", content:await blobToB64(b.blob)})}); }
    catch(e){ if(e.status!==422) throw e; }             // 422 = already uploaded
    b.pending=false; await idb.put("blobs",b);
  }
}
const assets={
  async upload(blob, opt){ const id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/[^a-z0-9]/gi,"").slice(0,32); const type=opt?.type||blob.type||"image/jpeg";
    await idb.put("blobs",{id, blob, type, pending:true}); schedulePush();
    const url=URL.createObjectURL(blob); photoUrls[id]=url; return {id, url, sizeBytes:blob.size, contentType:type}; },
  async list(){ return {assets:[], usage:{files:0,bytes:0,maxFiles:0,maxBytes:0}}; },
  async delete(){ return {deleted:false}; }
};
async function photoUrl(id){
  if(photoUrls[id]) return photoUrls[id];
  const b=await idb.get("blobs",id).catch(()=>null);
  if(b) return photoUrls[id]=URL.createObjectURL(b.blob);
  const c=cfg(); if(!c.token||!navigator.onLine) throw new Error("offline");
  const r=await gh(`${repo()}/contents/photos/${id}.jpg`,{accept:"application/vnd.github.raw", raw:true});
  const blob=await r.blob(); await idb.put("blobs",{id, blob, type:"image/jpeg", pending:false});
  return photoUrls[id]=URL.createObjectURL(blob);
}
/* fill <img data-photo="id"> after each render */
function hydratePhotos(root){ (root||document).querySelectorAll("img[data-photo]").forEach(img=>{ if(img.dataset.loaded) return; img.dataset.loaded="1"; const id=img.dataset.photo;
  photoUrl(id).then(u=>{ img.src=u; const a=img.closest("a[data-photo-link]"); if(a) a.href=u; }).catch(()=>{ img.alt="Photo (loads when online)"; img.dataset.loaded=""; }); }); }

/* ---------- Claude via the Anthropic API ---------- */
const API="https://api.anthropic.com/v1";
function apiHeaders(){ return {"x-api-key":cfg().key, "anthropic-version":"2023-06-01", "content-type":"application/json", "anthropic-dangerous-direct-browser-access":"true"}; }
function apiErr(status, body){ const msg=body?.error?.message||("API "+status); const e=new Error(msg); e.status=status;
  e.code= status===401||status===403?"bad_key": status===429||status===529?"rate_limited": status===400&&/credit|billing|balance/i.test(msg)?"no_credit": status===400&&/image/i.test(msg)?"image_rejected": status>=500?"unavailable":"upstream_error"; return e; }
async function listModels(){ const r=await fetch(API+"/models?limit=100",{headers:apiHeaders()}); if(!r.ok){ let j=null; try{ j=await r.json(); }catch(_){} throw apiErr(r.status,j); } return (await r.json()).data||[]; }
/* Each job gets its own model: small + cheap where it's reading numbers, bigger where it's judgement.
   label = nutrition panels, barcodes, "200 g salmon"-type lookups; meal = plate photos (portion judgement);

  return setCfg({taskModels:tm, models:ids.slice(0,30), model:tm.coach, modelBig:tm.deep}); }
async function toImageBlock(img, n=1){
  const side=n<=5?1568:n<=20?1100:800;  /* keep many-photo requests under the API size limit */
  const bmp=await createImageBitmap(img); const k=Math.min(1,side/Math.max(bmp.width,bmp.height));
  const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k); cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85)); return {type:"image", source:{type:"base64", media_type:"image/jpeg", data:await blobToB64(b)}}; }
async function call(prompt, {images=[], stream=false, onText, big=false, task=null, max_tokens=2000}={}){
  const c=cfg();
  if(!c.key){ const e=new Error("No API key"); e.code="not_granted"; throw e; }
  if(!navigator.onLine){ const e=new Error("Offline"); e.code="unavailable"; throw e; }
  if(!c.taskModels){ try{ await pickModels(); }catch(e){ if(e.code) throw e; } }
  const tm=cfg().taskModels||{}; const m=tm[task||(big?"deep":"coach")] || cfg().model;
  const imgs=images.slice(0,100); const content=[]; for(const im of imgs) content.push(await toImageBlock(im, imgs.length)); content.push({type:"text", text:prompt});
  let r; try{ r=await fetch(API+"/messages",{method:"POST", headers:apiHeaders(), body:JSON.stringify({model:m, max_tokens, messages:[{role:"user",content}], ...(stream?{stream:true}:{})})}); }
  catch(e){ const x=new Error("Network error"); x.code="unavailable"; throw x; }
  if(!r.ok){ let j=null; try{ j=await r.json(); }catch(_){} throw apiErr(r.status,j); }
  if(!stream){ const j=await r.json(); return (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join(""); }
  const rd=r.body.getReader(), dec=new TextDecoder(); let buf="", text="";
  for(;;){ const {done,value}=await rd.read(); if(done) break; buf+=dec.decode(value,{stream:true}); let i;
    while((i=buf.indexOf("\n\n"))>=0){ const chunk=buf.slice(0,i); buf=buf.slice(i+2); const line=chunk.split("\n").find(l=>l.startsWith("data:")); if(!line) continue;
      let ev; try{ ev=JSON.parse(line.slice(5).trim()); }catch(_){ continue; }
      if(ev.type==="content_block_delta"&&ev.delta?.type==="text_delta"){ text+=ev.delta.text; onText&&onText({text}); }
      if(ev.type==="error") throw apiErr(ev.error?.type==="overloaded_error"?529:500, ev); } }
  return text;
}
function parseJSON(t){ const s=String(t).replace(/^\s*```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim(); try{ return JSON.parse(s); }catch(e){}

const PRINCIPLES = `TRAINING PRINCIPLES (from the research; follow them when planning or suggesting changes):
1) Exercise order: big multi-joint lifts first while fresh, then single-joint work. A meta-analysis (Nunes 2020) found order barely changes hypertrophy but gives more strength gain in whatever comes first, and fresh heavy lifts are safer for the user's lower back and right shoulder. Whatever he most wants to grow goes earlier.
2) Equipment layout is only a tie-breaker. Group machines that are near each other so he doesn't cross the gym repeatedly, but never override principle 1 or his safety for it. Do not plan the session in walking order.
3) Volume: roughly 10–20 hard sets per muscle per week, with diminishing returns above that (Pelland 2025); frequency matters little.
4) Reps and sets: growth is similar from about 5 to 30 reps if sets end close to failure (0–3 reps in reserve). Use heavier work (5–10 reps) on stable, loadable multi-joint lifts, and moderate-to-high reps (10–20), sometimes with an extra set, on isolation, small-muscle and joint-sensitive moves (lateral raises, curls, triceps, calves, knee extension, rear delts, rotator cuff). Keep heavy spinal-loaded lifts away from failure.
5) The user may add a lighter extra set after failing early (a drop set). That is fine; track which lifts he pushes past failure and use it when judging fatigue and progress. Use sparingly on squats and deadlifts.

/* ---------- targets (Mifflin-St Jeor; protein 1.6-2.2 g/kg) ---------- */
function calcTargets(P){
  const w=Number(P.weightKg)||80, h=Number(P.heightCm)||175, a=Number(P.age)||30;
  const base=10*w+6.25*h-5*a;
  const bmr = P.sex==="female" ? base-161 : P.sex==="male" ? base+5 : base-78;
  const tdee = bmr*(Number(P.activity)||1.45);
  const fac={lose:0.80, recomp:0.93, maintain:1, build:1.10}[P.goal]||1;
  const floor = P.sex==="female" ? 1400 : 1600;
  const train = Math.max(floor+100, Math.round((tdee*fac+100)/50)*50);
  const rest = Math.max(floor, train-200);
  const pk = {lose:2.1, recomp:2.1, build:1.9, maintain:1.6}[P.goal]||1.8;
  const pw = P.goalKg && P.goal==="lose" ? Math.min(w, Math.max(P.goalKg*1.1, w*0.85)) : w;   // heavier people: base protein nearer goal weight
  const p = Math.round(pw*pk/5)*5;
  const mk=k=>{ const f=Math.round(k*0.27/9/5)*5; const c=Math.max(60, Math.round((k-p*4-f*9)/4/5)*5); return {kcal:k, p, f, c, fib:Math.round(k/1000*14), na:2300, fe: P.sex==="female"?18:8, veg:5, fruit:2, water: Math.round((w*0.035+0.5)*2)/2}; };
  return {train:mk(train), rest:mk(rest), bmr:Math.round(bmr), tdee:Math.round(tdee)};
}

function scaleItems(items, foods, factor){
  return items.map(([id,g])=>{ const f=foods[id]; let x=g*factor; if(!f) return {food:id,g:Math.round(g)};
    if(f.unit && f.unit.g>=30){ x=Math.max(1,Math.round(x/f.unit.g))*f.unit.g; }
    else if(g<=20){ x=Math.max(1,Math.round(x)); }
    else x=Math.round(x/5)*5;
    return {food:id,g:x}; });
}
function itemsKcal(items, foods){ return items.reduce((a,it)=>a+(foods[it[0]]?foods[it[0]].kcal*it[1]/100:0),0); }
function allowedMeal(m,P,foods){
  if((m.lvl||0) > (DIET_LVL[P.diet]??3)) return false;
  if(P.dairyFree && m.dairy) return false;
  const av=String(P.avoid||"").toLowerCase().split(/[,;\n]+/).map(s=>s.trim()).filter(s=>s.length>2);
  if(av.length){ for(const [id] of m.items){ const n=((foods[id]||{}).name||id).toLowerCase(); if(av.some(a=>n.includes(a)||a.includes(n.split(" ")[0]))) return false; } }
  return true;
}
function scheduleBuild(P, kind){   // kind: "train" | "rest"
  const W=tmin(P.wake), S_=tmin(P.sleep), items=[];
  const tw=P.trainWhen||"evening";
  let B=W+45, L=12*60+30, D=18*60+30, Tt=null;
  if(kind==="train"){ if(tw==="morning"){ Tt=W+30; B=Tt+75; } else if(tw==="midday"){ Tt=12*60; L=Tt+75; } else { Tt=17*60+30; D=Tt+105; } }
  items.push({t:tstr(W),k:"wake",title:"Wake up + 500 ml water",detail:"A glass of water before anything else.",water:0.5});
  items.push({t:tstr(W+2),k:"weigh",title:"Weigh-in",detail:"After the toilet, before food or drink. Mon, Wed, Fri.",days:[1,3,5]});
  if(kind==="train" && tw==="morning") items.push({t:tstr(Tt),k:"train",title:"Train",train:true,end:tstr(Tt+60),detail:""});
  items.push({t:tstr(B),k:"meal",slot:"breakfast",title:"Breakfast",detail:""});
  items.push({t:tstr(Math.max(B+120,10*60)),k:"water",title:"500 ml water",detail:"Keep a bottle on your desk.",water:0.5});
  if(kind==="train" && tw==="midday") items.push({t:tstr(Tt),k:"train",title:"Train",train:true,end:tstr(Tt+60),detail:""});
  items.push({t:tstr(L),k:"meal",slot:"lunch",title:"Lunch + 500 ml water",detail:"",water:0.5});
  if(P.snack) items.push({t:tstr(15*60+30),k:"meal",slot:"snack",title:"Afternoon snack + 500 ml water",detail:"",water:0.5});
  if(kind==="rest") items.push({t:tstr(17*60),k:"move",title:"Walk, 20 to 30 min",end:tstr(17*60+30),detail:"Easy pace. This is your cardio on a rest day."});
  if(kind==="train" && tw==="evening") items.push({t:tstr(Tt),k:"train",title:"Train",train:true,end:tstr(Tt+60),detail:"Eat your snack 60 to 90 minutes before."});
  items.push({t:tstr(D),k:"meal",slot:"dinner",title:"Dinner + 250 ml water",detail:"",water:0.25});
  items.push({t:tstr(Math.min(D+90,S_-90)),k:"move",title:"Evening stretch, 10 min",detail:"Loosen up hips, back and shoulders."});
  items.push({t:tstr(S_-60),k:"sleep",title:"Wind down",detail:"Dim the lights and put the phone away from the bed."});
  items.push({t:tstr(S_),k:"sleep",title:"Lights out",detail:"Sleep is when training turns into muscle."});
  return items.sort((a,b)=>tmin(a.t)-tmin(b.t));
}
function buildPlan(P, foods){
  P={...PROFILE_DEFAULT,...P};
  const T=calcTargets(P), meals={}, days={}, today=new Date();
  const share = P.snack ? {breakfast:.25,lunch:.30,dinner:.33,snack:.12} : {breakfast:.28,lunch:.32,dinner:.40};
  const slotTimes=sk=>{ const W=tmin(P.wake); return {breakfast:tstr(W+45),lunch:"12:30",snack:"15:30",dinner:"18:30"}[sk]; };
  const labels={breakfast:"Breakfast",lunch:"Lunch",snack:"Afternoon snack",dinner:"Dinner"};
  const pick={};
  for(const sk of Object.keys(share)){
    let opts=MEAL_LIB[sk].filter(m=>allowedMeal(m,P,foods));
    if(opts.length<2) opts=MEAL_LIB[sk].filter(m=>(m.lvl||0)<=0 && !m.dairy);
    pick[sk]=opts.slice(0,5);
    for(const m of pick[sk]){
      const target=T.train.kcal*share[sk], k=itemsKcal(m.items,foods)||1;
      const factor=Math.max(0.7,Math.min(1.6,target/k));
      meals[m.id]={name:m.name, items:scaleItems(m.items,foods,factor), note:m.note||""};
    }
  }
  const slots=Object.keys(share).map(sk=>({label:labels[sk],opts:pick[sk].map(m=>m.id),slot:sk,time:slotTimes(sk)}));
  const trainDows=({2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,4,5,6],6:[1,2,3,4,5,6]})[Math.max(2,Math.min(6,Number(P.days)||3))];
  const restDays=[0,1,2,3,4,5,6].filter(d=>!trainDows.includes(d));
  for(let d=0;d<7;d++) days[String(d)]=JSON.parse(JSON.stringify(slots));
  const dietTxt=DIET_LABEL[P.diet]||"";
  const rules=[
    `Protein first: ${T.train.p} g a day is the number that matters most.`,
    `Diet: ${dietTxt}.${P.dairyFree?" No dairy.":""}${P.avoid?" Avoids or is allergic to: "+P.avoid+".":""} Never suggest foods that break these.`,
    `Goal: ${GOAL_LABEL[P.goal]||"stay healthy"}. Carbs go around training.`,
    `Servings: countable foods (wraps, bread slices, eggs, fruit, tins, bars) are planned in whole multiples of the food's unit size, never fractions.`,
    "Keep sodium under 2,300 mg a day and get 5 serves of veg and 2 of fruit.",
  ];
  return {version:1, guest:true, starts:todayStrSafe(today), restDays, targets:{train:T.train,rest:T.rest}, rules, shopExtras:[], meals, days,
    schedule:{train:scheduleBuild(P,"train"), rest:scheduleBuild(P,"rest")},
    scheduleDays:Object.fromEntries([0,1,2,3,4,5,6].map(d=>[String(d), trainDows.includes(d)?"train":"rest"])),
    updated:Date.now()};
}

function programFor(place,n){
  const set=WORKOUTS[place]||WORKOUTS.gym; n=Math.max(2,Math.min(6,Number(n)||3));
  if(n<=3) return Array.from({length:n},(_,i)=>set.fb[i%set.fb.length]);
  if(n===4) return [0,1,2,3].map(i=>set.ul[i%set.ul.length]);
  if(n===5) return [set.ppl[0],set.ppl[1],set.ppl[2],set.ul[0],set.ul[1]];
  return [0,1,2,0,1,2].map(i=>set.ppl[i]);
}
function buildDays(P){
  P={...PROFILE_DEFAULT,...P};
  const trainDows=({2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,4,5,6],6:[1,2,3,4,5,6]})[Math.max(2,Math.min(6,Number(P.days)||3))];
  const prog=programFor(P.place,P.days), out={};
  for(let d=0;d<7;d++){
    const i=trainDows.indexOf(d);
    if(i>=0){ const [title,sub,items]=prog[i]; out[d]={key:"w"+i, short:title.split(" ")[0], title, sub, mins:"~"+(items.length>6?"60":"45")+" min", items}; }
    else out[d]={key:"light", short:"Rest", title:"Rest day", sub:"Easy walk + mobility", mins:"~30 min", items:["z2Home","mobility"]};
  }
  return out;
}
function equipmentFor(place){

  if(place==="bw") return [{id:"g1",name:"Bodyweight only",area:"At home",note:""}];
  return [];
}
/* ---------- medication / supplement reminders ---------- */
function medsOn(P,date){
  const dow=new Date(date+"T12:00:00").getDay(), out=[];
  for(const m of (P.meds||[])){
    if(!m||!m.name) continue;
    let on=false; const f=m.freq||"daily";
    if(f==="daily") on=true;
    else if(f==="weekly"||f==="days"||f==="twice") on=(m.days||[]).map(Number).includes(dow);
    else if(f==="every2weeks"){ on=(m.days||[]).map(Number).includes(dow); if(on && m.start){ const wk=Math.round((new Date(date+"T12:00:00")-new Date(m.start+"T12:00:00"))/604800000); on = wk%2===0; } }
    if(m.start && date<m.start) on=false;
    if(on) out.push({t:m.time||"08:00",k:"supp",title:m.name+(m.dose?" "+m.dose:""),detail:m.notes||"",id:"med_"+m.id});
  }
  return out;
}

const CAL="Google Calendar"; const calWatch={}; S.calEv={}; S.calBusy={}; S.calStatus=null; S.calList=null;
function tzOff(date){ const o=-parseD(date).getTimezoneOffset(); const a=Math.abs(o); return (o>=0?"+":"-")+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0"); }
function calIds(){ const c=S.settings.cals; return (c&&c.length)? c.map(x=>x.id) : ["primary"]; }
function hhmm(d){ return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function parseEvents(payload, date){
  const out=[]; for(const e of (payload?.events||[])){
    if(!e?.start?.dateTime || !e?.end?.dateTime) continue;            // all-day: ignore
    if(e.status==="cancelled" || e.transparency==="transparent" || e.availability==="AVAILABILITY_FREE") continue;
    if(e.eventType && !["DEFAULT","FOCUS_TIME","OUT_OF_OFFICE","FROM_GMAIL"].includes(e.eventType)) continue;
    if((e.attendees||[]).some(a=>a.self && a.responseStatus==="declined")) continue;
    const s=new Date(e.start.dateTime), en=new Date(e.end.dateTime);
    const sd=todayStr(s), ed=todayStr(en);
    if(ed<date || sd>date) continue;
    out.push({s: sd<date?"00:00":hhmm(s), e: ed>date?"23:59":hhmm(en), label: String(e.summary||"Busy").slice(0,60), src:"cal"});
  } return out;
}
const CAL_MSG={needs_reauth:"Reconnect Google Calendar in claude.ai Settings → Connectors.",server_not_connected:"Add Google Calendar in claude.ai Settings → Connectors.",selection_required:"Choose which Google Calendar connector to use when the app asks.",not_in_manifest:"Calendar access is turned off for this app. Reload and allow it to sync.",blocked_by_policy:"Your account settings block calendar access here.",approval_required:"Calendar access needs approval here."};
function watchCalDay(date){
  if(!mcp) return;
  const today=todayStr(), keep=new Set();
  for(const id of calIds()) for(const d of new Set([date,today])){
    const k=d+"|"+id; keep.add(k); if(calWatch[k]) continue;
    calWatch[k]=mcp.watchTool(CAL,"list_events",{calendarId:id,startTime:`${d}T00:00:00${tzOff(d)}`,endTime:`${addDays(d,1)}T00:00:00${tzOff(d)}`,orderBy:"startTime",pageSize:100}, ev=>{
      S.calEv[d]=S.calEv[d]||{};
      if(ev.type==="data"){ S.calEv[d][id]=parseEvents(ev.result?.payload,d); S.calStatus={ok:true, at: ev.result?.cache?.storedAt || Date.now()}; }
      else { const c=ev.error?.code; if(["needs_reauth","server_not_connected","not_in_manifest","blocked_by_policy","approval_required","selection_required"].includes(c)) S.calEv[d][id]=[]; S.calStatus={ok:false, msg: CAL_MSG[c] || "Couldn't reach Google Calendar just now. It will try again shortly."}; }
      S.calBusy[d]=Object.values(S.calEv[d]).flat();
      softRender();
    }, {refetchInterval:300000, cache:{staleTime:60000}});
  }
  for(const k of Object.keys(calWatch)) if(!keep.has(k)){ try{ calWatch[k](); }catch(_){} delete calWatch[k]; }
}
function resetCalWatches(){ for(const k of Object.keys(calWatch)){ try{ calWatch[k](); }catch(_){} delete calWatch[k]; } S.calEv={}; S.calBusy={}; watchCalDay(S.date); }
const dirty = new Set();

function todayStr(d=new Date()){ const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
function parseD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return todayStr(d); }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function r25(x){ return Math.round(x*4)/4; }
function fmtN(x){ const v=r25(x); return (Number.isInteger(v)?v:v.toFixed(v*4%2?2:1)).toString(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function stepOf(id){ const o=S.settings.steps?.[id]; return (o&&o.step)||EX[id].step||2.5; }
function addStepOf(id){ const o=S.settings.steps?.[id]; return (o&&o.addStep)||EX[id].addStep||2.5; }
function programStart(){ return S.settings.programStart || todayStr(); }
function bwOn(date){
  const ds = Object.keys(S.bw).filter(d=>d<=date).sort();
  if (ds.length) return S.bw[ds[ds.length-1]];
  const all = Object.keys(S.bw).sort();
  return all.length ? S.bw[all[0]] : S.settings.bw;
}
function latestBw(){ const all=Object.keys(S.bw).sort(); return all.length? S.bw[all[all.length-1]] : S.settings.bw; }

/* ---------- load display (the signed-number system) ---------- */
function loadLabel(id, L, date){
  const ex = EX[id];
  if (ex.kind!=="assisted") return {main: fmtN(L)+" kg"+(ex.perHand?" per hand":""), plate:"", eff:""};
  const bw = bwOn(date||S.date);
  const eff = r25(bw + L);
  if (L<0)  return {main:"−"+fmtN(-L)+" kg", plate:'<span class="plate assist">Assist</span>', eff:"lifting "+fmtN(eff)+" kg of "+fmtN(bw)};
  if (L===0)return {main:"Bodyweight", plate:'<span class="plate bw">0 kg</span>', eff:"lifting "+fmtN(bw)+" kg"};
  return {main:"+"+fmtN(L)+" kg", plate:'<span class="plate added">Added</span>', eff:"lifting "+fmtN(eff)+" kg ("+fmtN(bw)+" + "+fmtN(L)+")"};
}
function nextUp(id, L){
  const ex=EX[id];
  if (ex.kind==="assisted"){ if (L<0) return Math.min(0, r25(L+stepOf(id))); return r25(L+addStepOf(id)); }
  return r25(L+stepOf(id));
}
function nextDown(id, L){
  const ex=EX[id];
  if (ex.kind==="assisted"){ if (L<=0) return r25(L-stepOf(id)); return Math.max(0, r25(L-addStepOf(id))); }
  return Math.max(0, r25(L-stepOf(id)));
}

/* ---------- progression engine ---------- */
function extraN(id,s){ return Number(s&&s.extra&&s.extra[id])||0; }
function extraTxt(s,id){ const n=extraN(id,s); return n?` (added ${n} extra drop set${n>1?"s":""} after hitting failure, at a lighter weight)`:""; }
function pushedText(date){
  const out=[]; for(let i=14;i>=0;i--){ const d=addDays(date,-i); const s=S.sessions[d]; if(!s||!s.extra) continue; for(const [id,n] of Object.entries(s.extra)){ if(Number(n)>0&&EX[id]) out.push(`${EX[id].name} ${d} (+${n})`); } }
  return out.length?`PUSHED PAST FAILURE with extra drop sets, last 14 days: ${out.join("; ")}.`:"";
}
function history(id, beforeDate){
  const out=[];
  for (const d of Object.keys(S.sessions).sort().reverse()){
    if (beforeDate && d>=beforeDate) continue;
    const sets = S.sessions[d]?.sets?.[id];
    if (!sets) continue;
    const logged = sets.slice(0,(EX[id]&&EX[id].sets)||sets.length).filter(s=>s && s.r!=null && s.r!=="" );
    if (!logged.length) continue;
    out.push({date:d, sets:logged, fail:!!S.sessions[d]?.flags?.[id]?.fail});
  }
  return out; // newest first
}
function firstDate(id){ const h=history(id); return h.length? h[h.length-1].date : null; }
function fastStartFor(id){ const ps=programStart(); const fd=firstDate(id); return (fd && fd>ps)? fd : ps; }
function phaseOn(id, date){
  const start=fastStartFor(id); const days=daysBetween(start,date); const len=(S.settings.fastWeeks||4)*7;
  return (days < len) ? {fast:true, left: Math.min(len, Math.max(0,len-days))} : {fast:false, left:0};
}
function evalSession(id, h){
  const ex=EX[id];
  const loads = ex.kind==="reps" ? [0] : h.sets.map(s=>Number(s.l)).filter(v=>!isNaN(v));
  const L = ex.kind==="reps" ? 0 : (loads.length? Math.max(...loads) : null);
  const allAtL = ex.kind==="reps" || h.sets.every(s=>Number(s.l)===L);
  const hit = h.sets.length>=ex.sets && allAtL && h.sets.every(s=>Number(s.r)>=ex.hi) && !(ex.capped && h.fail);
  const miss = h.sets.every(s=>Number(s.r)<ex.lo);
  return {L, hit, miss};
}
function suggest(id, date){
  const ex=EX[id];
  const h=history(id, date);
  if (ex.kind==="reps"){
    if (!h.length) return {L:0, status:"hold", why:`Aim for ${ex.lo}–${ex.hi}${ex.unit||""} per set.`};
    const e0=evalSession(id,h[0]);
    return e0.hit ? {L:0,status:"up",why:`You hit ${ex.hi} last time. Slow the tempo or add a pause to make it harder.`} : {L:0,status:"hold",why:`Work toward ${ex.hi}${ex.unit||""} on every set.`};
  }
  if (!h.length){
    if (ex.start!=null) return {L:ex.start, status:"new", why:`Starting point. Adjust if ${ex.lo} reps feels too easy or too hard.`};
    return {L:null, status:"new", why:`First session: pick a weight you could lift ${ex.hi} times with 2–3 reps left. That becomes your baseline.`};
  }
  const e0=evalSession(id,h[0]);
  if (e0.L==null) return {L:null,status:"new",why:"No weight logged last time."};
  const ph=phaseOn(id, h[0].date);
  const up=nextUp(id,e0.L), down=nextDown(id,e0.L);
  if (ex.capped && h[0].fail) return {L:e0.L, status:"hold", why:"Last session got too close to failure. Same weight, 2–3 reps left in the tank."};
  if (e0.hit){
    if (ph.fast) return {L:up, status:"up", why:`All sets hit ${ex.hi} reps. Fast phase, so it goes up.`};
    const e1 = h[1] ? evalSession(id,h[1]) : null;
    if (e1 && e1.hit && e1.L===e0.L) return {L:up, status:"up", why:`Hit ${ex.hi} reps two sessions in a row. Moving up.`};
    return {L:e0.L, status:"hold", why:`1 of 2: hit all ${ex.hi}s again at this weight to move up.`};
  }
  if (e0.miss){
    const e1 = h[1] ? evalSession(id,h[1]) : null;
    if (e1 && e1.miss && e1.L===e0.L) return {L:down, status:"back", why:`Under ${ex.lo} reps two sessions running. Step back one notch and rebuild.`};
  }
  return {L:e0.L, status:"hold", why:`Same weight. Aim for ${ex.hi} reps on every set.`};
}

function queueSave(path, getData, delay=700){
  dirty.add(path);
  cacheAll();
  clearTimeout(saveTimers[path]);
  saveTimers[path]=setTimeout(()=>flush(path,getData), delay);
  if (db) setSync("busy");
}
async function flush(path, getData){
  if (!db){ dirty.delete(path); return; }
  if (writing[path]){ saveTimers[path]=setTimeout(()=>flush(path,getData),400); return; }
  writing[path]=true;
  try{ await db.doc(path).set(getData()); dirty.delete(path); setSync("ok"); }
  catch(e){
    if (e && e.code==="unavailable"){ setTimeout(()=>flush(path,getData), 1500+Math.random()*1000); }

function nearestSlot(date){
  const sl=slotsFor(date); if(!sl.length) return "extra";
  const now=new Date(); const mins=now.getHours()*60+now.getMinutes();
  let best=sl[0].slot, bd=1e9;
  for(const s of sl){ const [h,m]=s.time.split(":").map(Number); const d=Math.abs(h*60+m-mins); if(d<bd){bd=d;best=s.slot;} }
  const eaten=new Set((S.food[date]?.entries||[]).map(e=>e.slot));
  if(eaten.has(best)){ const nxt=sl.find(s=>!eaten.has(s.slot)); if(nxt) best=nxt.slot; }
  return best;
}

function stockOn(date){

  const first=ps.map(p=>p.date).sort()[0]; const bought={};
  for(const p of ps) for(const [f,g] of Object.entries(p.mine||{})) bought[f]=(bought[f]||0)+Number(g||0);

function shopItems(start,end){
  const need={}, meals={};
  for(let d=start; d<=end; d=addDays(d,1)){
    for(const sl of slotsFor(d)){
      if(sl.slot==="evening") continue;
      const k=chosenMeal(d,sl), m=S.plan.meals[k]; if(!m || m.noShop) continue;
      meals[m.name]=(meals[m.name]||0)+1;
      for(const it of m.items||[]) need[it.food]=(need[it.food]||0)+Number(it.g||0);
    }
  }
  const out=[], have=[]; const stock=stockOn(start); let cost=0, priced=0;
  for(const [id,gNeed] of Object.entries(need)){
    const f=S.foods[id]||{name:id}; const sh=f.shop||{aisle:"Other",label:f.name};
    const inStock=Math.min(gNeed, stock[id]||0); const g0=gNeed-inStock;
    if(!sh.pantry && g0<=gNeed*0.1 && inStock>0){ have.push({id, label:sh.label||f.name, g:Math.round(inStock)}); continue; }
    const g=g0*(sh.ratio||1);
    let qty;
    if(sh.pantry) qty=`need about ${Math.ceil(g/10)*10} g`;
    else if(id==="egg") qty=`${Math.ceil(g/52)} eggs`;
    else if(sh.per){ const n=Math.max(1,Math.ceil(g/sh.per-0.15)); qty=`${n} ×`; }
    else { const r=Math.ceil(g/50)*50; qty= r>=1000? `about ${(r/1000).toFixed(1)} kg` : `about ${r} g`; }
    const pr=priceOf(id); let c=null;
    if(pr && !sh.pantry){ const buyG = sh.per? Math.max(1,Math.ceil(g/sh.per-0.15))*sh.per : g; c=pr*buyG/1000; cost+=c; priced++; }
    out.push({id, aisle:sh.aisle, label:sh.label||f.name, qty, g:Math.round(g), pantry:!!sh.pantry, per:sh.per, have:inStock>0?Math.round(inStock):0, cost:c});
  }
  const sp=S.settings.supps||{};
  if(sp.creatine) out.push({id:"supp_creatine", aisle:"Pantry", label:"creatine monohydrate (300 g tub lasts about 2 months)", qty:"need about 35 g", g:35, pantry:true});
  if(sp.vitd) out.push({id:"supp_vitd", aisle:"Pantry", label:"vitamin D (as your GP advised)", qty:"7 doses", g:0, pantry:true});
  if(sp.iron) out.push({id:"supp_iron", aisle:"Pantry", label:"iron supplement (as your GP advised)", qty:"4 doses", g:0, pantry:true});
  out.sort((a,b)=>AISLES.indexOf(a.aisle)-AISLES.indexOf(b.aisle) || a.label.localeCompare(b.label));
  return {items:out, meals, have, cost, priced};
}

/* ---------- coach inbox ----------
   Anything that needs AI but can't be answered in the page right now (photos in a browser view,
   no in-page Claude, or offline) is queued here. Photos + request wait in this phone's IndexedDB

S.inbox={}; S.outbox=[]; S.synced={};

const OBX={mem:[]};
function obxOpen(){ if(OBX.p) return OBX.p; OBX.p=new Promise(res=>{ try{ const r=indexedDB.open("coachgb-outbox",1); r.onupgradeneeded=()=>r.result.createObjectStore("q",{keyPath:"id"}); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } }); return OBX.p; }
async function obxTx(mode, fn){ const d=await obxOpen(); if(!d) return null; return new Promise((res,rej)=>{ try{ const tx=d.transaction("q",mode); const r=fn(tx.objectStore("q")); tx.oncomplete=()=>res(r?r.result:null); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }catch(e){ rej(e); } }); }
async function obxAll(){ try{ const r=await obxTx("readonly", st=>st.getAll()); if(r) return r.concat(OBX.mem); }catch(e){} return OBX.mem.slice(); }
async function obxPut(rec){ try{ if(await obxOpen()){ await obxTx("readwrite", st=>st.put(rec)); return; } }catch(e){} OBX.mem=OBX.mem.filter(x=>x.id!==rec.id).concat([rec]); }
async function obxDel(id){ OBX.mem=OBX.mem.filter(x=>x.id!==id); try{ await obxTx("readwrite", st=>st.delete(id)); }catch(e){} }

async function queueInbox({type, date, prompt, meta, files}){

  const rec={id, type, date, prompt, meta:meta||{}, blobs, photos:[], createdAt:Date.now()};
  await obxPut(rec); S.outbox=(await obxAll()).map(x=>({id:x.id,type:x.type,date:x.date,meta:x.meta,createdAt:x.createdAt,n:x.blobs.length}));
  flushOutbox(); return id;
}
async function flushOutbox(){

    for(const r of all){

      if(!navigator.onLine) break;
      if(r.type==="body" && assets && r.blobs.length>r.photos.length){
        for(let i=r.photos.length;i<r.blobs.length;i++){ const up=await assets.upload(r.blobs[i],{type:"image/jpeg"}); r.photos.push(up.id); await obxPut(r); }
      }
      let result;
      try{ result=await sample.json(r.prompt, {images:r.blobs, task:r.type==="body"?"deep":r.type==="meal"?(r.blobs.length?"meal":"label"):"coach", max_tokens:r.type==="body"?3000:2500}); }

        } else if(it.type==="question"){

          const fd=foodDay(it.date); if(!fd.coach.some(c=>c.inboxId===it.id)){ fd.coach.push({t:Date.now(), q:it.meta?.q||"", a:String(r.answer||r.text||""), inboxId:it.id}); if(fd.coach.length>10) fd.coach=fd.coach.slice(-10); saveFood(it.date); }
        } else if(it.type==="body"){

async function shrink(file, max=1600){
  const bmp=await createImageBitmap(file); const k=Math.min(1, max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); return c;

async function decodeBarcode(file){

  }catch(e){}
  try{
    await loadScript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js");
    const c=await shrink(file,1400);
    const hints=new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128]);
    const reader=new ZXing.BrowserMultiFormatReader(hints);

}

async function sendReply(kind, date){
  const q=(document.getElementById("rq-"+kind)?.value||"").trim(); if(!q){ toast("Type your reply first."); return; }
  const holder = kind==="week" ? S.coachNote : S.sessions[date]?.review; if(!holder) return;
  const orig = kind==="week" ? `his weekly check-in note: "${holder.body}"` : `your review of his ${date} session: "${holder.summary}" ${(holder.advice||[]).join(" ")}`;
  const ctx=queued=>coachPrompt(q, queued)+`\nCONTEXT: ${PN()} is replying to ${orig}${threadText(holder.thread)}\nAnswer his reply directly. If he questions a change or suggestion, explain the reason plainly and be open to changing it.`;
  const queueIt=async()=>{ await queueInbox({type:"question", date, prompt:ctx(true), meta:{q, thread:kind}}); toast("Sent. Your coach answers "+coachEta()+"."); render(); };
  if(!sample||!navigator.onLine){ await queueIt(); return; }
  S.busy=true; toast("Thinking…"); render();
  try{
    const r=await sample(ctx(false),{cache:false, task:"coach"});
    holder.thread=[...(holder.thread||[]),{t:Date.now(), q, a:r.text}].slice(-10);
    if(kind==="week") await db.doc("coach/notes").set(S.coachNote); else saveSession(date);
  }catch(e){
    if(e.code==="not_granted"||e.code==="unavailable") await queueIt();
    else toast(e.code==="rate_limited"?"Too many requests. Try again in a bit.":"Couldn't reach the coach. Try again.");
  }
  S.busy=false; render();
}
async function askCoach(){
  const q=(document.getElementById("coachq")?.value||"").trim();
  const out=document.getElementById("coachout"); if(!out) return;
  if(!sample){ await queueInbox({type:"question", date:S.date, prompt:coachPrompt(q, true), meta:{q}}); toast("Sent. Your coach answers "+coachEta()+"."); render(); return; }
  out.hidden=false; out.textContent="Thinking…"; S.busy=true;
  document.querySelectorAll('[data-act="coach"]').forEach(b=>b.disabled=true);
  const prompt=coachPrompt(q, false);
  try{
    const r=await sample(prompt,{cache:false, task:"coach", onText:({text})=>{ out.textContent=text; }});
    const fd=foodDay(S.date); fd.coach.push({t:Date.now(), q, a:r.text}); if(fd.coach.length>10) fd.coach=fd.coach.slice(-10); saveFood(S.date);
  }catch(e){
    if(e.code==="not_granted"||e.code==="unavailable"){ await queueInbox({type:"question", date:S.date, prompt:coachPrompt(q, true), meta:{q}}); out.textContent="Sent to your coach, who'll answer "+coachEta()+"."; }
    else out.textContent = (e.text||"") + (e.code==="rate_limited"?"\nToo many requests. Try again in a bit.":e.code==="cancelled"?"":"\nCouldn't reach the coach. Try again.");
  }
  S.busy=false; document.querySelectorAll('[data-act="coach"]').forEach(b=>b.disabled=false);
}
function coachPrompt(q, queued){

${coachContext(S.date)}
${q?`THEY ASK: ${q}`:"No specific question: tell him how today is tracking and exactly what to eat for the rest of the day to hit protein and stay near calories, plus one training or recovery tip for today."}${queued?`\nThis was sent from his phone at ${new Date().toLocaleString()} and you are answering later: answer as of the time he asked. Reply with only JSON {"answer":"your reply as plain text"}.`:""}`;
}

async function scanPhoto(file){
  const A=S.add; A.msg="Reading barcode…"; A.err=false; A.busy=true; render();
  const ai = (sample && navigator.onLine) ? sample.json(`This photo is of a food package, taken to scan its barcode. It may also show the nutrition information panel.
1. "barcode": the barcode digits if printed and legible, else null.
2. "name": the product name/brand if visible, else "".
3. "panel": true only if a nutrition information panel is visible AND you can read energy, protein, fat and carbohydrate for it; otherwise false.
4. If panel is true, extract values PER 100 g (or per 100 mL): convert from per-serving using the serving size if needed, kJ→kcal ÷4.184. "c" = total carbohydrate, "fib" = dietary fibre (0 if not listed), "na" = sodium mg, "fe" = iron mg (0 if not listed), "servingG" = serving size in g if shown.
Reply with only JSON like {"barcode":"9300...","name":"...","panel":true,"kcal":159,"p":19,"f":8.6,"c":0.6,"fib":1.2,"na":15,"fe":3,"servingG":100}.`, {images:[file], task:"label"}).catch(()=>null) : Promise.resolve(null);
  let bc=await decodeBarcode(file);
  if(bc && findBarcode(bc)){ A.busy=false; handleBarcode(bc); return; }
  A.msg="Checking the photo for the nutrition panel…"; render();
  const out=await ai; A.busy=false;
  bc = bc || (out && out.barcode ? String(out.barcode).replace(/\D/g,"") : null) || null;
  if(bc && findBarcode(bc)){ handleBarcode(bc); return; }

/* ---------- progress ---------- */
function lineChart(points, opts={}){
  // points: [{x:dateStr, y:number}]
  if (points.length<1) return `<p class="muted small">No data yet.</p>`;
  const W=520,H=190,pl=40,pr=12,pt=12,pb=26;
  const xs=points.map(p=>parseD(p.x).getTime());
  let ys=points.map(p=>p.y); if(opts.goal!=null) ys=ys.concat([opts.goal]); if(opts.zero) ys=ys.concat([0]);
  let x0=Math.min(...xs), x1=Math.max(...xs); if(x1===x0){x0-=86400000*3;x1+=86400000*3;}
  let y0=Math.min(...ys), y1=Math.max(...ys); const pad=Math.max(2,(y1-y0)*0.12); y0=Math.floor(y0-pad); y1=Math.ceil(y1+pad);
  const X=t=>pl+(t-x0)/(x1-x0)*(W-pl-pr), Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  const ticks=4; let grid="";
  for(let i=0;i<=ticks;i++){ const v=y0+(y1-y0)*i/ticks; grid+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}</text>`; }
  const fx=t=>new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});
  grid+=`<text x="${pl}" y="${H-6}" font-size="11" fill="var(--muted)">${fx(x0)}</text><text x="${W-pr}" y="${H-6}" font-size="11" text-anchor="end" fill="var(--muted)">${fx(x1)}</text>`;
  let extra="";
  if(opts.goal!=null) extra+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(opts.goal)}" y2="${Y(opts.goal)}" stroke="var(--green)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-pr}" y="${Y(opts.goal)-5}" text-anchor="end" font-size="11" fill="var(--green)">Goal ${fmtN(opts.goal)}</text>`;
  if(opts.zero && y0<0 && y1>0) extra+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink)" stroke-width="1" opacity=".5"/><text x="${W-pr}" y="${Y(0)-5}" text-anchor="end" font-size="11" fill="var(--muted)">Bodyweight</text>`;
  const pts=points.map(p=>[X(parseD(p.x).getTime()),Y(p.y)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H-pb} L${pts[0][0].toFixed(1)} ${H-pb} Z`;
  const last=pts[pts.length-1];
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"Chart")}">${grid}${extra}
    ${pts.length>1?`<path d="${area}" fill="var(--blue)" opacity=".10"/><path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linejoin="round"/>`:""}
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--blue)"/>`).join("")}
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" fill="var(--surface)" stroke="var(--blue)" stroke-width="2.2"/></svg></div>`;
}

/* ---------- phone reminders via ntfy (free push app) ----------
   The app schedules each Today step as a delayed ntfy message (X-Delay), keyed by a stable sequence id,
   and cancels/reschedules them (DELETE /topic/id) whenever the day changes. Looks 36 h ahead. */
const NTFY="https://ntfy.sh";
const REM_SKIP=new Set(["work","rest","busy"]);
const REM_TAG={wake:"sunrise",weigh:"scales",move:"person_in_lotus_position",self:"shower",meal:"fork_and_knife",dog:"dog2",plan:"memo",water:"droplet",drink:"coffee",drive:"car",train:"muscle",supp:"pill",sleep:"zzz"};
function remTopic(){ return S.settings.ntfyTopic||""; }
function remState(){ try{ return JSON.parse(localStorage.getItem(LSP+"coach.rem"))||{}; }catch(_){ return {}; } }
function remSave(st){ try{ localStorage.setItem(LSP+"coach.rem", JSON.stringify(st)); }catch(_){} }
function hashId(s){ let h=5381; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))>>>0; return h.toString(36); }
function remDesired(){
  const out={}; const now=Date.now(), horizon=now+36*3600e3;
  for(const date of [todayStr(), addDays(todayStr(),1)]){
    for(const it of scheduleFor(date)){
      if(it.busy||REM_SKIP.has(it.k)||isDone(it,date)) continue;
      const [y,mo,d]=date.split("-").map(Number); const [h,mi]=it.t.split(":").map(Number);
      const at=new Date(y,mo-1,d,h,mi).getTime(); if(at<now+60e3||at>horizon) continue;
      const id="c"+date.replace(/-/g,"")+"-"+hashId(it.key);
      const title=(it.train&&it.title==="Train"?"Train: "+dayFor(date).title:it.title);
      out[id]={at:Math.round(at/1000), title, body:String(it.detail||"").slice(0,300), tag:REM_TAG[it.k]||"bell", prio:it.k==="train"||it.k==="supp"?4:3};
    }
  }
  return out;
}
async function ntfy(method, path, headers, body){ const r=await fetch(NTFY+path,{method, headers, body}); if(!r.ok && !(method==="DELETE"&&r.status===404)) throw new Error("ntfy "+r.status); return r; }
async function reminderSync(force){
  const topic=remTopic(); if(!topic || S.settings.remindersOn===false || !navigator.onLine) return;
  if(reminderSync.run) { reminderSync.again=true; return; } reminderSync.run=true;
  try{
    const want=remDesired(), have=remState(); const nowS=Date.now()/1000;
    for(const [id,v] of Object.entries(have)){ if(v.at<nowS-60){ delete have[id]; continue; } const w=want[id]; if(!w || w.at!==v.at || w.title!==v.title){ await ntfy("DELETE",`/${topic}/${id}`); delete have[id]; } }
    for(const [id,w] of Object.entries(want)){ if(have[id]&&!force) continue;
      await ntfy("POST",`/${topic}`,{"X-Sequence-ID":id,"X-Title":w.title,"X-Tags":w.tag,"X-Priority":String(w.prio),"X-Delay":String(w.at),"X-Click":location.href.split("#")[0]}, w.body||w.title);
      have[id]={at:w.at,title:w.title}; }
    remSave(have); S.remStatus={ok:true, at:Date.now(), n:Object.keys(have).length};
  }catch(e){ S.remStatus={ok:false, msg:String(e.message||e)}; }
  finally{ reminderSync.run=false; if(reminderSync.again){ reminderSync.again=false; setTimeout(()=>reminderSync(),2000); } }
}
function scheduleReminderSync(){ clearTimeout(scheduleReminderSync.t); scheduleReminderSync.t=setTimeout(()=>reminderSync(), 8000); }

/* ---------- updates from Claude: a .json "coach patch" file, installed from the phone ----------
   Lets any Claude session (even with no computer linked) ship app updates and data fixes:
   Claude sends a file, the user opens it here, the app writes it to GitHub with the phone's token.
   Format: {"coachPatch":1,"note":"...","files":[{"path":"app/app.html","b64":"..."} | {"path":"data/foods/x.json","json":{...},"mode":"set"|"merge"} | {"repo":"coach","path":"sw.js","b64":"..."}]} */
const PATCH_OK=/^(app\/app\.html|data\/[A-Za-z0-9_.\-]+\/[A-Za-z0-9_.\-]+\.json|src\/[A-Za-z0-9_.\/\-]+|setup\/[A-Za-z0-9_.\-]+|\.github\/workflows\/[A-Za-z0-9_.\-]+\.ya?ml|tools\/[A-Za-z0-9_.\-]+)$/;
const SHELL_OK=/^(index\.html|sw\.js|manifest\.webmanifest|privacy\.html|icon-[a-z0-9]+\.png)$/;
async function readPatch(file){
  const P=S.patch={busy:true}; render();
  try{
    const j=JSON.parse(await file.text());
    if(j.coachPatch!==1 || !Array.isArray(j.files)) throw new Error("That isn't a Coach update file.");
    for(const f of j.files){ const ok= f.repo==="coach" ? SHELL_OK.test(f.path) : PATCH_OK.test(f.path); if(!ok) throw new Error("Refused: unexpected path "+f.path); }
    S.patch={busy:false, note:String(j.note||""), files:j.files, name:file.name};
  }catch(e){ S.patch={busy:false, err:e.message||String(e)}; }
  render();
}
function b64bytes(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function applyPatch(){
  const P=S.patch; if(!P?.files) return; P.busy=true; P.done=0; render();
  const C=window.coach, c=C.cfg();
  try{
    for(const f of P.files){
      const m=f.path.match(/^data\/([^/]+)\/([^/]+)\.json$/);
      if(m && !f.repo && f.json){   // data: go through the local store so the phone sees it now and sync stays consistent
        const path=m[1]+"/"+m[2]; const ref=db.doc(path);
        if(f.mode==="merge"){ const cur=await ref.get(); if(cur.exists) await ref.update(f.json); else await ref.set(f.json); } else await ref.set(f.json);
      } else {
        const repo = f.repo==="coach" ? `/repos/${c.owner}/coach` : C.repo();
        const content = f.b64 ? f.b64 : btoa(unescape(encodeURIComponent(f.json? JSON.stringify(f.json) : String(f.text||""))));
        let sha=null; try{ sha=(await C.gh(`${repo}/contents/${f.path}`)).sha; }catch(_){}
        await C.gh(`${repo}/contents/${f.path}`,{method:"PUT", body:JSON.stringify({message:"update from Claude: "+(P.note||f.path).slice(0,60), content, ...(sha?{sha}:{})})});
      }
      P.done++; render();
    }
    const appChanged=P.files.some(f=>f.path==="app/app.html"&&!f.repo);
    S.patch={ok:true, msg:`Installed ${P.files.length} file${P.files.length===1?"":"s"}.${appChanged?" Close and reopen the app to use the new version.":""}`};
    C.sync();
  }catch(e){ S.patch={...P, busy:false, err:"Stopped: "+(e.message||e)+(e.status===401||e.status===403?" (check the GitHub token in Connections)":"")}; }
  render();
}

function setLoad(id,i,v, propagate){
  const s=sessionFor(S.date); const sets=s.sets[id]=s.sets[id]||[];
  sets[i]={...(sets[i]||{}), l: v};
  // bumping set 1 carries the new load to later sets that have no reps yet
  if(propagate && i===0){ for(let j=1;j<EX[id].sets;j++){ if(!sets[j]||sets[j].r==null||sets[j].r===""){ sets[j]={...(sets[j]||{}), l:v}; const el=document.getElementById(`l-${id}-${j}`); if(el) el.value=fmtN(v); updEff(id,j,v);} } }

}

function wireOb(el){

    if(t.dataset.med){ keep(); const p=MED_PRESETS.find(x=>x.k===t.dataset.med); const ix=D.meds.findIndex(m=>m.k===p.k); if(ix>=0) D.meds.splice(ix,1); else D.meds.push({id:"m"+Date.now().toString(36)+Math.floor(Math.random()*99),k:p.k,name:p.name,dose:"",freq:p.freq,days:[...p.days],time:p.time,notes:p.notes,start:todayStr()}); obRender(); return; }
    if(t.dataset.mset){ keep(); const [mid,f,v]=t.dataset.mset.split("|"); const m=D.meds.find(x=>x.id===mid); if(m){ m[f]=v; if(f==="freq"){ if(v==="daily") m.days=[]; else if(!(m.days||[]).length) m.days=[1]; } } obRender(); return; }
    if(t.dataset.mday){ keep(); const [mid,d]=t.dataset.mday.split("|"); const m=D.meds.find(x=>x.id===mid); if(m){ const n=Number(d), a=m.days||[]; const lim=m.freq==="twice"?2:(m.freq==="days"?7:1); if(a.includes(n)) m.days=a.filter(x=>x!==n); else { m.days=[...a,n]; if(m.days.length>lim) m.days=m.days.slice(-lim); } } obRender(); return; }
    if(t.id==="obCancel"){ obClose(); return; }
    if(t.id==="obBack"){ if(id==="tour"&&OB.tourSlide>0) OB.tourSlide--; else if(id==="ai"&&OB.ai>0){ OB.ai--; OB.msg=""; } else OB.i=Math.max(0,OB.i-1); OB.err=""; obRender(); return; }
    if(t.id==="obSkip"){ OB.err=""; if(OB.only){ obClose(); render(); return; } if(id==="ai"){ OB.ai=0; } OB.i=Math.min(OB_STEPS.length-1,OB.i+1); obRender(); return; }

      if(id==="ai"){
        if(st.aiTest){ await obTestKey(); return; }
        if(OB.ai===0 && window.coach.cfg().key){ OB.i++; OB.ai=0; obRender(); return; }
        if(OB.ai<5){ OB.ai++; OB.msg=""; obRender(); return; }

        OB.i++; OB.ai=0; obRender(); return;
      }
      if(st.ok){ const r=st.ok(); if(r!==true){ OB.err=r; obRender(); return; } }
      OB.err="";
      if(OB.only===id){ await obSaveOnly(id); return; }
      if(id==="build"){ OB.busy=true; obRender(); try{ await obFinish(); } finally{ OB.busy=false; } return; }
      OB.i++; obRender(); return;
    }
  });
  el.addEventListener("input",e=>{
    const t=e.target;

    if(t.id==="aikey"){ OB.keyDraft=t.value; }
  });
}

/* ---------- data schema + migrations ----------

   Everything is forward-only and tolerant: a rolled-back build ignores a newer schema number. */
const GUEST_SCHEMA=1;
const MIGRATIONS={ /* 2: ()=>{ ... } */ };
function runMigrations(){
  const cur=lsGet("schema")||0; if(cur>=GUEST_SCHEMA) return;
  try{ const c=localStorage.getItem(LSP+"cache"); if(c) localStorage.setItem(LSP+"cache.pre"+GUEST_SCHEMA, c); }catch(_){}   // safety copy before touching anything
  for(let v=cur+1; v<=GUEST_SCHEMA; v++){ try{ MIGRATIONS[v]&&MIGRATIONS[v](); }catch(e){ console.error("migration "+v+" failed", e); } }
  lsSet("schema",GUEST_SCHEMA);
}
